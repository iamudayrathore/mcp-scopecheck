name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to publish (for example, v0.1.1)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish tagged distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-scopecheck
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Verify annotated tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "${RELEASE_TAG}" != "${RELEASE_TAG#v}"
          test "$(git cat-file -t "${RELEASE_TAG}")" = "tag"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          package_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "${RELEASE_TAG#v}" = "${package_version}"

      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check build==1.5.0 setuptools==84.0.0 wheel==0.48.0

      - name: Build distributions from the tagged source
        run: python -m build --no-isolation --outdir dist

      - name: Publish distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
